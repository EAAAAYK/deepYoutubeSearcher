        let currentResults = [];
        const bookmarks = new Set();

        function loadSavedBookmarks() {
          try {
            const raw = localStorage.getItem("deep_yt_demo_bookmarks");
            if (raw) {
              const arr = JSON.parse(raw);
              arr.forEach((id) => bookmarks.add(id));
            }
          } catch (e) {
            console.error(e);
          }
        }

        function saveBookmarksToStorage() {
          try {
            localStorage.setItem(
              "deep_yt_demo_bookmarks",
              JSON.stringify(Array.from(bookmarks)),
            );
          } catch (e) {
            console.error(e);
          }
        }

        function setCategory(cat) {
          const el = document.getElementById("keyword-input");
          if (el) el.value = cat;
          runDemoSearch();
        }

        function runDemoSearch() {
          const grid = document.getElementById("video-grid");
          const loading = document.getElementById("loading-overlay");
          const empty = document.getElementById("empty-state");
          const countBadge = document.getElementById("results-count-badge");
          const sonarStatus = document.getElementById("sonar-status-text");

          const kwInput = document.getElementById("keyword-input");
          const keyword = (kwInput ? kwInput.value.trim() : "") || "哲学";

          if (grid) grid.innerHTML = "";
          if (empty) empty.classList.add("hidden");
          if (loading) loading.classList.remove("hidden");
          if (countBadge) countBadge.innerText = "照合中...";
          if (sonarStatus)
            sonarStatus.textContent =
              "DEMO SCANNING // SEARCHING ARCHIVE DATABASE...";

          setTimeout(() => {
            if (loading) loading.classList.add("hidden");

            let matched = database.filter((item) => {
              const k = keyword.toLowerCase();
              return (
                item.keyword.toLowerCase().includes(k) ||
                item.title.toLowerCase().includes(k) ||
                item.channel.toLowerCase().includes(k)
              );
            });

            if (matched.length === 0) {
              matched = database;
            }

            // ★常にシャッフルして最大3件のみを厳選抽出するロジック
            currentResults = [...matched]
              .sort(() => 0.5 - Math.random())
              .slice(0, 3)
              .map((v) => {
                let yearsAgo = "";
                if (v.publishedAt) {
                  const pubYear = new Date(v.publishedAt).getFullYear();
                  if (!isNaN(pubYear)) {
                    const diff = new Date().getFullYear() - pubYear;
                    yearsAgo = diff > 0 ? diff + "年前" : "今年";
                  }
                }

                return {
                  id: v.id,
                  title: v.title,
                  channel: v.channel,
                  publishedAt: v.publishedAt,
                  yearsAgo: yearsAgo,
                  viewCount: v.views,
                  durationMinutes: v.duration,
                  durationFormatted: v.duration + "分",
                  url: buildWatchUrl(v.id),
                  thumbnail: buildThumbnailUrl(v.id),
                };
              });

            if (sonarStatus) {
              sonarStatus.textContent =
                "SONAR ACTIVE // キーワード: [ " + keyword + " ]";
            }

            if (currentResults.length === 0) {
              if (empty) empty.classList.remove("hidden");
              if (countBadge) countBadge.innerText = "0 件検出";
              renderVideoGrid([]);
              return;
            }

            if (empty) empty.classList.add("hidden");
            if (countBadge)
              countBadge.innerText = currentResults.length + " 件検出";

            renderVideoGrid(currentResults);
          }, 800);
        }

        function renderVideoGrid(videos) {
          const grid = document.getElementById("video-grid");
          if (!grid) return;
          grid.innerHTML = "";

          videos.forEach(function (vid) {
            const isBookmarked = bookmarks.has(vid.id);

            const card = document.createElement("div");
            card.className =
              "cyber-card rounded-xl overflow-hidden flex flex-col justify-between group";

            card.innerHTML = [
              "<div>",
              '  <div class="relative aspect-video bg-slate-900 overflow-hidden">',
              '    <img src="' +
                vid.thumbnail +
                '" alt="' +
                escapeHtml(vid.title) +
                '" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 opacity-85 group-hover:opacity-100">',
              '    <div class="absolute bottom-2 right-2 bg-slate-950/80 backdrop-blur border border-slate-700/80 text-cyan-300 font-mono text-xs px-2 py-0.5 rounded">',
              "      " + vid.durationFormatted,
              "    </div>",
              vid.yearsAgo
                ? '<div class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur border border-slate-700/80 text-slate-300 font-mono text-xs px-2 py-0.5 rounded">' +
                  vid.yearsAgo +
                  " (" +
                  vid.publishedAt +
                  ")</div>"
                : "",
              "  </div>",
              '  <div class="p-4 space-y-2">',
              '    <h3 class="text-sm font-bold text-slate-100 line-clamp-2 leading-snug group-hover:text-cyan-300 transition">',
              '      <a href="' +
                vid.url +
                '" target="_blank" rel="noopener noreferrer">' +
                escapeHtml(vid.title) +
                "</a>",
              "    </h3>",
              '    <p class="text-xs text-slate-400 font-mono flex items-center gap-1">',
              '      <i class="ph-bold ph-user-circle"></i>',
              '      <span class="truncate">' +
                escapeHtml(vid.channel) +
                "</span>",
              "    </p>",
              "  </div>",
              "</div>",
              '<div class="px-4 pb-4 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs font-mono">',
              '  <span class="text-emerald-400">' +
                vid.viewCount.toLocaleString() +
                " 回再生</span>",
              '  <div class="flex items-center gap-2">',
              "    <button onclick=\"toggleBookmark('" +
                vid.id +
                '\')" class="p-1.5 rounded-lg border ' +
                (isBookmarked
                  ? "border-cyan-500 bg-cyan-500/20 text-cyan-300"
                  : "border-slate-700 hover:border-slate-500 text-slate-400") +
                ' transition cursor-pointer" title="キープ/保存">',
              '      <i class="ph-bold ' +
                (isBookmarked
                  ? "ph-bookmark-simple-fill"
                  : "ph-bookmark-simple") +
                '"></i>',
              "    </button>",
              '    <a href="' +
                vid.url +
                '" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-slate-800 hover:bg-cyan-500/20 hover:text-cyan-300 border border-slate-700 rounded-lg text-slate-300 transition flex items-center gap-1">',
              '      再生 <i class="ph-bold ph-arrow-square-out"></i>',
              "    </a>",
              "  </div>",
              "</div>",
            ].join("");
            grid.appendChild(card);
          });
        }

        function toggleBookmark(id) {
          if (bookmarks.has(id)) {
            bookmarks.delete(id);
          } else {
            bookmarks.add(id);
          }
          saveBookmarksToStorage();
          updateBookmarkBadge();
          renderBookmarkDrawerList();
          renderVideoGrid(currentResults);
        }

        function updateBookmarkBadge() {
          const el = document.getElementById("bookmark-count");
          if (el) el.innerText = bookmarks.size;
        }

        function toggleBookmarkPanel() {
          const drawer = document.getElementById("bookmark-drawer");
          if (drawer) drawer.classList.toggle("translate-x-full");
        }

        function renderBookmarkDrawerList() {
          const list = document.getElementById("bookmark-list");
          if (!list) return;
          list.innerHTML = "";

          if (bookmarks.size === 0) {
            list.innerHTML =
              '<p class="text-xs text-slate-500 text-center py-8 font-mono">保存された動画はありません</p>';
            return;
          }

          database.forEach(function (vid) {
            if (bookmarks.has(vid.id)) {
              const watchUrl = buildWatchUrl(vid.id);
              const item = document.createElement("div");
              item.className =
                "p-3 bg-slate-900 border border-slate-800 rounded-lg flex gap-3 items-center justify-between";
              item.innerHTML = [
                '<div class="min-w-0 flex-1">',
                '  <a href="' +
                  watchUrl +
                  '" target="_blank" class="text-xs font-bold text-slate-200 hover:text-cyan-300 truncate block">' +
                  escapeHtml(vid.title) +
                  "</a>",
                '  <p class="text-[10px] text-slate-400 font-mono">' +
                  escapeHtml(vid.channel) +
                  "・" +
                  vid.views.toLocaleString() +
                  "回</p>",
                "</div>",
                "<button onclick=\"toggleBookmark('" +
                  vid.id +
                  '\')" class="text-xs text-rose-400 hover:text-rose-300 p-1 cursor-pointer">削除</button>',
              ].join("");
              list.appendChild(item);
            }
          });
        }

        function clearAllBookmarks() {
          bookmarks.clear();
          saveBookmarksToStorage();
          updateBookmarkBadge();
          renderBookmarkDrawerList();
          renderVideoGrid(currentResults);
        }

        function sortResults() {
          const sel = document.getElementById("sort-select");
          if (!sel) return;
          const type = sel.value;
          if (type === "views-asc") {
            currentResults.sort((a, b) => a.viewCount - b.viewCount);
          } else if (type === "views-desc") {
            currentResults.sort((a, b) => b.viewCount - a.viewCount);
          } else if (type === "date-desc") {
            currentResults.sort(
              (a, b) => new Date(b.publishedAt) - new Date(a.publishedAt),
            );
          } else if (type === "duration-desc") {
            currentResults.sort(
              (a, b) => b.durationMinutes - a.durationMinutes,
            );
          }
          renderVideoGrid(currentResults);
        }

        function escapeHtml(str) {
          return str
            ? str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
            : "";
        }

        window.runDemoSearch = runDemoSearch;
        window.setCategory = setCategory;
        window.toggleBookmark = toggleBookmark;
        window.toggleBookmarkPanel = toggleBookmarkPanel;
        window.clearAllBookmarks = clearAllBookmarks;
        window.sortResults = sortResults;

        document.addEventListener("DOMContentLoaded", function () {
          loadSavedBookmarks();
          updateBookmarkBadge();
          runDemoSearch();
        });
      })();
    </script>
  </body>
</html>
